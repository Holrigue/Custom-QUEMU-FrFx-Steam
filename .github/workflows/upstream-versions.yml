name: Versions Firefox et Steam
on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-versions
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Update dedicated automation branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch=automation/upstream-versions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --create "$branch" "origin/$branch"
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git switch --create "$branch"
          fi
          python3 -m unittest discover -s tests
          python3 scripts/scan-upstream.py
          git add -- versions/upstream.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: actualiser les versions officielles Firefox et Steam'
          fi
          if [ "$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD")" -eq 0 ]; then
            exit 0
          fi
          git push origin "HEAD:refs/heads/$branch"
          if [ "$(gh pr list --head "$branch" --base "$DEFAULT_BRANCH" --state open --json number --jq length)" -eq 0 ]; then
            if ! gh pr create --head "$branch" --base "$DEFAULT_BRANCH" \
              --title 'Versions officielles Firefox et Steam' \
              --body 'Metadonnees relevees dans les sources officielles. Aucun binaire ni disque de VM modifie. La compatibilite du prototype doit etre testee avant validation.'; then
              echo '::warning::Branche actualisee, mais PR non creee. Verifier les permissions Actions et ouvrir la PR manuellement si necessaire.'
            fi
          fi
